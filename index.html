<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CST</title>
  <meta
  name="theme-color"
  content="#ff0000"
  media="(prefers-color-scheme: light)" />
<meta
  name="theme-color"
  content="#ff0000"
  media="(prefers-color-scheme: dark)" />
</head>

<body>
  <div id="cst--app" class="loading"></div>
  <script type="module" src="/src/main.ts"></script>
  <style>
    body{
      background-color: black;
    }
    #cst--app.loading:after, #cst--app.loading:before{
      content: '';
      position: absolute;
      height: 20px;
      border-radius: 10px;
      top: calc(50% - 10px);
      left: 25vw;
    }
    #cst--app.loading:after{
      background-color: rgb(255, 59, 48);
      width: 20px;
    }
    #cst--app.loading:before{
      background-color: white;
      opacity: 0.2;
      width: 50vw;
    }
  </style>
</body>

</html>
